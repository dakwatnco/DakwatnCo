    .video-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 aspect ratio */
      height: 0;
      overflow: hidden;
      max-width: 100%;
      border-radius: 16px; /* adjust radius as you like */
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;

      gap: 20px;

    .project-card {
      position: relative;
      overflow: hidden;
      border-radius: 20px;
    }

    .project-card img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.4s ease;
    }

    .project-card:hover img {
      transform: scale(1.05);
    }

    .project-info {
      position: absolute;
      bottom: 15px;
      left: 15px;
      background: rgba(0,0,0,0.5);
      padding: 10px 15px;
      border-radius: 10px;

    .project-info h3 {

    /*HEADING*/

    .top-hero {

      margin: 40px 0;

    /* Stack wrapper */
    .top-hero__stack {
      position: relative;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Big background title */
    .top-hero__title {
      position: absolute;
      top: 50%; /* middle vertically */
      left: 0;  /* stick to the left border */
      transform: translateY(-50%); /* keep centered vertically */
      font-size: clamp(48px, 10vw, 140px); /* responsive size */
      font-weight: 900;
      color: #ffffff;
      opacity: 0.15; /* make it look like background text */
      z-index: 1; /* behind image */
      white-space: nowrap;
      text-transform: uppercase;

      /* extra styling for readability */
      -webkit-text-stroke: 1px rgba(0,0,0,0.3);
      text-shadow: 0 2px 6px rgba(0,0,0,0.2);

    /* Image on top */

      z-index: 2;
      display: block;
      width: 100%;
      height: auto;

  <!--HEADING-->
  <script>
    const faders = document.querySelectorAll('.fade-in-section');

    const appearOptions = {
      threshold: 0.15,
      rootMargin: "0px 0px -50px 0px"
    };

    const appearOnScroll = new IntersectionObserver((entries, observer) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        entry.target.classList.add("is-visible");
        observer.unobserve(entry.target);
      });
    }, appearOptions);

    faders.forEach(fader => {
      appearOnScroll.observe(fader);
    });
  </script>
