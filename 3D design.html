  <style>
    .video-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 aspect ratio */
      height: 0;
      overflow: hidden;
      max-width: 100%;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

      /* Put this inside your <style> tag or in your CSS file */
    .item-details-page img {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .item-details-page img:hover {
      transform: scale(1.15); /* Makes it slightly bigger */
      box-shadow: 0 10px 20px rgba(0,0,0,0.2); /* Adds a soft shadow */
      z-index: 2;
    }

    /*for top project*/
    .top-projects {
      /*padding: 50px 0;*/
      /*background-color: #000; same as your screenshot */
      color: #fff;
    }

    .section-title {
      font-size: 3rem;
      font-weight: 900;
      margin-bottom: 30px;
    }

    .section-title span {
      display: block;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .project-card {
      position: relative;
      overflow: hidden;
      border-radius: 20px;
    }

    .project-card img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.4s ease;
    }

    .project-card:hover img {
      transform: scale(1.05);
    }

    .project-info {
      position: absolute;
      bottom: 15px;
      left: 15px;
      background: rgba(0,0,0,0.5);
      padding: 10px 15px;
      border-radius: 10px;
    }

    .project-info h3 {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .project-info p {
      margin: 0;
      font-size: 0.9rem;
    }

    .section-heading {
      margin-bottom: 50px;
    }

  </style>
